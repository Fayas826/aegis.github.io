# A.E.G.I.S. Canonical stack. The Python FastAPI backend (port 8000) is the
# single source of API truth. The legacy Node enterprise gateway is retained
# under the optional "enterprise" profile for backward compatibility.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # All secrets are injected from the shell/.env — never hardcoded.
      AEGIS_PORT: 8000
      JARVIS_PIN: ${JARVIS_PIN:?Set JARVIS_PIN in .env}
      JARVIS_API_KEY: ${JARVIS_API_KEY:?Set JARVIS_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ./backend:/app/backend
      - ./core:/app/core
      - ./frontend:/app/frontend
      - ./infrastructure:/app/infrastructure
      - ./project_memory:/app/project_memory
      - ./runstate:/app/runstate
    restart: unless-stopped

  enterprise:
    build: .
    command: ["npm", "run", "dev:backend"]
    profiles: ["enterprise"]
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/jarvis}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - API_KEY=${JARVIS_API_KEY:?Set JARVIS_API_KEY in .env}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - .:/app
      - /app/node_modules
      - ./generated:/app/generated
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    profiles: ["enterprise"]
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-jarvis_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}

  redis:
    image: redis:7-alpine
    profiles: ["enterprise"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    profiles: ["enterprise"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    profiles: ["enterprise"]
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  opencv_service:
    build:
      context: ./infrastructure/biometrics
    profiles: ["enterprise"]
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  mongo-data:
  redis-data:
