<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEGIS Cyber Security Landing</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Glassmorphism base */
    .glass {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Dark mode glass */
    .dark .glass {
      background: rgba(0,0,0,0.15);
    }
    /* Hover physics */
    .physics:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
  </style>
</head>
<body class="bg-linear-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen flex flex-col">
  <div id="root" class="flex-1"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [dark, setDark] = useState(true);
      useEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
      }, [dark]);

      const toggleDark = () => setDark(prev => !prev);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Navbar */}
          <nav className="glass p-4 mx-4 mt-4 rounded-xl shadow-lg flex justify-between items-center">
            <h1 className="text-2xl font-bold physics">AEGIS Cyber</h1>
            <button onClick={toggleDark} className="p-2 rounded-full hover:bg-white/20 transition">
              {dark ? '🌙' : '☀️'}
            </button>
          </nav>

          {/* Hero Section */}
          <section className="flex-1 flex flex-col justify-center items-center text-center px-4">
            <h2 className="text-5xl md:text-7xl font-extrabold mb-4 physics">
              Secure Your Digital Frontier
            </h2>
            <p className="text-xl md:text-2xl mb-8">
              Cutting‑edge protection for enterprises and individuals alike.
            </p>
            <button className="glass py-3 px-6 text-lg font-semibold physics hover:bg-white/20 transition">
              Get Started
            </button>
          </section>

          {/* Features */}
          <section className="py-12 bg-gray-800/50">
            <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-8 px-4">
              {[
                {
                  icon: '🛡️',
                  title: 'Zero‑Day Defense',
                  desc: 'Instant threat detection and containment before impact.',
                },
                {
                  icon: '🔒',
                  title: 'Quantum‑Ready Encryption',
                  desc: 'Post‑quantum cryptography to safeguard all data streams.',
                },
                {
                  icon: '📊',
                  title: 'Real‑Time Analytics',
                  desc: 'Live dashboards with AI‑driven insights and alerts.',
                },
              ].map((f, i) => (
                <div key={i} className="glass p-6 rounded-xl shadow-md physics hover:shadow-xl transition">
                  <div className="text-4xl mb-4">{f.icon}</div>
                  <h3 className="text-2xl font-semibold mb-2">{f.title}</h3>
                  <p>{f.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Call to Action */}
          <section className="py-12 bg-linear-to-r from-indigo-600 to-purple-600 text-center">
            <h3 className="text-3xl font-bold mb-4 physics">Ready to Fortify?</h3>
            <p className="text-lg mb-8">Join thousands of secure organizations worldwide.</p>
            <button className="glass py-3 px-6 text-lg font-semibold physics hover:bg-white/20 transition">
              Contact Us
            </button>
          </section>

          {/* Footer */}
          <footer className="bg-gray-900 py-6 text-center">
            <p className="text-sm">&copy; 2026 AEGIS Cyber Security. All rights reserved.</p>
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
